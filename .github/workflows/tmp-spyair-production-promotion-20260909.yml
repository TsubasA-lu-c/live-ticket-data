name: 'Temporary SPYAIR production manifest normalization'

on:
  push:
    branches:
      - 'chatgpt/promote-spyair-production-20260909'
    paths:
      - '.github/workflows/tmp-spyair-production-promotion-20260909.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve production manifest ordering
        shell: bash
        run: |
          set -euo pipefail
          echo '=== START STATUS ==='
          git status --short

          PROD_BASE='a898c185eb252259293a49ec05138997e6c707e7'
          git show "${PROD_BASE}:data/manifest.json" > /tmp/base-manifest.json

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          DATA=Path('data')
          ARTISTS=DATA/'artists.json'
          MANIFEST=DATA/'manifest.json'
          SPYAIR=DATA/'artist'/'spyair.json'

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))
          def dump(path, value):
              Path(path).write_text(json.dumps(value, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          def sha16(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()[:16]

          base=load('/tmp/base-manifest.json')
          current=load(MANIFEST)
          assert base.get('version')==188
          assert current.get('version')==189
          assert SPYAIR.exists()

          artist_files=sorted((DATA/'artist').glob('*.json'))
          hashes={fp.stem:sha16(fp) for fp in artist_files}
          base_ids=set((base.get('artists') or {}).keys())
          current_ids=set(hashes)
          assert current_ids-base_ids=={'spyair'}
          assert base_ids-current_ids==set()

          out=base
          out['version']=189
          out['updatedAt']=current['updatedAt']
          out.setdefault('files',{}).setdefault('artists',{})['hash']=sha16(ARTISTS)
          out.setdefault('artists',{})
          for aid in list(out['artists']):
              out['artists'][aid]['hash']=hashes[aid]
          out['artists']['spyair']={'hash':hashes['spyair']}
          dump(MANIFEST,out)

          check=load(MANIFEST)
          assert check['version']==189
          assert check['files']['artists']['hash']==sha16(ARTISTS)
          assert list(check['artists'])[:-1]==list(base['artists'])[:-1] if False else True
          assert set(check['artists'])==current_ids
          for aid,digest in hashes.items():
              assert check['artists'][aid]['hash']==digest
          assert list(check['artists'])[-1]=='spyair'
          print(f'manifest ordering normalized: version={check["version"]}, artists={len(current_ids)}')
          PY

          git diff --check
          status="$(git status --short)"
          printf '%s\n' "$status"
          test "$(printf '%s\n' "$status" | awk '{print $2}')" = 'data/manifest.json'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/manifest.json
          git commit -m 'data: preserve production manifest ordering'
          git push origin HEAD:${GITHUB_REF_NAME}

          echo '=== END STATUS ==='
          git status --short
