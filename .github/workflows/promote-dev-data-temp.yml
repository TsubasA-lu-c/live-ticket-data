name: One-shot promote audited dev data

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  promote:
    if: github.head_ref == 'release/bootstrap-reconciliation-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Verify production baseline and copy pinned dev data
        run: |
          set -euo pipefail
          DEV_BASE=18df9af321c33080a0559d6d3d6042bcda2153cd
          DEV_TARGET=cdb4d22afd2fa71af6986bd61976f319e7cca3bd
          git clone --quiet https://github.com/TsubasA-lu-c/live-ticket-data-dev.git /tmp/live-ticket-data-dev
          cd /tmp/live-ticket-data-dev
          git checkout --quiet "$DEV_BASE"

          # Production must still be byte-for-byte identical to the audited dev baseline.
          diff -qr "$GITHUB_WORKSPACE/data" data

          git checkout --quiet "$DEV_TARGET"
          mapfile -t changed < <(git diff --name-only "$DEV_BASE" "$DEV_TARGET" -- data)
          test "${#changed[@]}" -eq 66

          artist_count=0
          for path in "${changed[@]}"; do
            case "$path" in
              data/manifest.json) ;;
              data/artist/*.json) artist_count=$((artist_count + 1)) ;;
              *) echo "unexpected changed path: $path"; exit 1 ;;
            esac
            test "$path" != "data/artists.json"
            mkdir -p "$GITHUB_WORKSPACE/$(dirname "$path")"
            cp "$path" "$GITHUB_WORKSPACE/$path"
          done
          test "$artist_count" -eq 65

          # After promotion, production data must exactly equal the pinned dev data tree.
          diff -qr "$GITHUB_WORKSPACE/data" data
          cd "$GITHUB_WORKSPACE"

          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('data/manifest.json').read_text())
          assert manifest['version'] == 159, manifest['version']
          for artist in ('babymetal', 'zutomayo'):
              payload = json.loads(Path(f'data/artist/{artist}.json').read_text())
              estimated = [p for p in payload['performances'] if p.get('performanceTimeEstimated') is True]
              assert estimated, artist
              for p in estimated:
                  assert p['performanceDate']
                  assert p['performanceAt'] == p['performanceDate'] + 'T12:00:00+09:00'
          PY

          rm .github/workflows/promote-dev-data-temp.yml
          git diff --check
      - name: Commit promoted data and remove one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data .github/workflows/promote-dev-data-temp.yml
          git commit -m 'Promote audited bootstrap reconciliation to production'
          git push origin HEAD:${{ github.head_ref }}
