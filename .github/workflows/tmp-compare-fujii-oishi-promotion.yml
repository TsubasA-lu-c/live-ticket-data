name: Temporary Fujii/Oishi production promotion audit

on:
  push:
    branches:
      - release/fujii-oishi-20260910
    paths:
      - '.github/workflows/tmp-compare-fujii-oishi-promotion.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify clean production checkout
        run: test -z "$(git status --short)"
      - name: Diagnose promotion delta against pinned Dev
        shell: bash
        run: |
          set -euo pipefail
          dev="$RUNNER_TEMP/dev"
          git clone --depth=1 --branch main https://github.com/TsubasA-lu-c/live-ticket-data-dev.git "$dev"
          test "$(git -C "$dev" rev-parse HEAD)" = "aef22c24ee720bf52fc904129e6b77644393e2cc"
          python3 - "$dev" <<'PY'
          import json, sys
          from pathlib import Path
          dev = Path(sys.argv[1]); prod = Path('.')
          def load(root, name): return json.loads((root/'data'/'artist'/f'{name}.json').read_text())
          def by_id(items): return {x['id']:x for x in items}
          def compare(label, pdoc, ddoc):
              out=[]
              for section in ('tours','performances','lotteries'):
                  p,d=by_id(pdoc.get(section,[])),by_id(ddoc.get(section,[]))
                  only_p=sorted(set(p)-set(d)); only_d=sorted(set(d)-set(p))
                  changed=[]
                  for i in sorted(set(p)&set(d)):
                      if p[i]!=d[i]:
                          fields=sorted(k for k in set(p[i])|set(d[i]) if p[i].get(k)!=d[i].get(k))
                          changed.append((i,fields))
                  print(label, section, 'only_prod=', only_p)
                  print(label, section, 'only_dev=', only_d)
                  print(label, section, 'changed=', changed)
                  out.append((section,only_p,only_d,changed))
              print(label, 'appleMusicTracks equal=', pdoc.get('appleMusicTracks',[])==ddoc.get('appleMusicTracks',[]))
              return out

          fp,fd=load(prod,'fujii_kaze'),load(dev,'fujii_kaze')
          assert set(by_id(fd['tours']))-set(by_id(fp['tours'])) == {'fujii_kaze_piano_recital_2026'}
          assert set(by_id(fd['performances']))-set(by_id(fp['performances'])) == {'fujii_kaze_piano_recital_2026_tokyo_1120','fujii_kaze_piano_recital_2026_tokyo_1121'}
          assert set(by_id(fd['lotteries']))-set(by_id(fp['lotteries'])) == {'fujii_kaze_piano_recital_2026_general'}
          for sec in ('tours','performances','lotteries'):
              p,d=by_id(fp[sec]),by_id(fd[sec])
              assert not (set(p)-set(d))
              assert all(p[i]==d[i] for i in set(p)&set(d))
          assert fp.get('appleMusicTracks',[])==fd.get('appleMusicTracks',[])
          print('FUJII: exact recital-only delta')

          expected_oishi_extra={
              'oishi_masayoshi_kariuta3_aichi_0919_cd_purchase',
              'oishi_masayoshi_kariuta3_aichi_0919_club014_area',
              'oishi_masayoshi_kariuta3_kanagawa_0830_cd_purchase',
              'oishi_masayoshi_kariuta3_okayama_0905_cd_purchase',
          }
          expected_masayoshi_extra={'masayoshi_oishi__rel__'+x for x in expected_oishi_extra}
          allowed_oishi_changed={
              'oishi_masayoshi_kariuta3_aichi_0919',
              'oishi_masayoshi_kariuta3_kanagawa_0830',
              'oishi_masayoshi_kariuta3_okayama_0905',
              'oishi_masayoshi_kariuta3_aichi_0919_20260919',
              'oishi_masayoshi_kariuta3_kanagawa_0830_20260830',
              'oishi_masayoshi_kariuta3_okayama_0905_20260905',
          }
          allowed_masayoshi_changed={'masayoshi_oishi__rel__'+x for x in allowed_oishi_changed}

          for name, expected_extra, allowed_changed in [
              ('oishi_masayoshi', expected_oishi_extra, allowed_oishi_changed),
              ('masayoshi_oishi', expected_masayoshi_extra, allowed_masayoshi_changed),
          ]:
              pdoc,ddoc=load(prod,name),load(dev,name)
              diffs=compare(name,pdoc,ddoc)
              seen_extra=set(); seen_changed=set()
              for section,only_p,only_d,changed in diffs:
                  assert not only_p, f'{name}: production-only ids in {section}: {only_p}'
                  seen_extra.update(only_d)
                  seen_changed.update(i for i,_ in changed)
              assert seen_extra == expected_extra, (name,'unexpected dev-only ids',seen_extra^expected_extra)
              assert seen_changed == allowed_changed, (name,'unexpected changed ids',seen_changed^allowed_changed)
              assert pdoc.get('appleMusicTracks',[])==ddoc.get('appleMusicTracks',[])
              print(name, 'delta is exactly reviewed Kariuta III correction/mirror set plus ordering')
          PY
      - name: Verify production checkout stayed clean
        run: test -z "$(git status --short)"
