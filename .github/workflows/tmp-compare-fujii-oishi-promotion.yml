name: One-shot Fujii/Oishi production promotion

on:
  push:
    branches:
      - release/fujii-oishi-20260910
    paths:
      - '.github/workflows/tmp-compare-fujii-oishi-promotion.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/fujii-oishi-20260910
          fetch-depth: 0

      - name: Verify clean and pinned production base
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --short)"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "eea903de4e4c3504afd4168de7868253b329cfc1"

      - name: Promote reviewed Dev payloads only
        shell: bash
        run: |
          set -euo pipefail
          dev="$RUNNER_TEMP/dev"
          git clone --depth=1 --branch main https://github.com/TsubasA-lu-c/live-ticket-data-dev.git "$dev"
          test "$(git -C "$dev" rev-parse HEAD)" = "aef22c24ee720bf52fc904129e6b77644393e2cc"

          cp "$dev/data/artist/fujii_kaze.json" data/artist/fujii_kaze.json
          cp "$dev/data/artist/oishi_masayoshi.json" data/artist/oishi_masayoshi.json
          cp "$dev/data/artist/masayoshi_oishi.json" data/artist/masayoshi_oishi.json

      - name: Rebuild production manifest from production data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          data = Path('data')
          manifest_path = data / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          def h16(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()[:16]

          old_version = int(manifest.get('version', 0))
          manifest['version'] = old_version + 1
          jst = timezone(timedelta(hours=9))
          manifest['updatedAt'] = datetime.now(jst).strftime('%Y-%m-%dT%H:%M:%S+09:00')
          manifest.setdefault('files', {}).setdefault('artists', {})['hash'] = h16(data / 'artists.json')
          entries = manifest.setdefault('artists', {})
          paths = sorted((data / 'artist').glob('*.json'))
          existing = {p.stem for p in paths}
          for p in paths:
              entries.setdefault(p.stem, {})['hash'] = h16(p)
          for aid in list(entries):
              if aid not in existing:
                  del entries[aid]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f"manifest version: {old_version} -> {manifest['version']}")
          print('updatedAt:', manifest['updatedAt'])
          PY

      - name: Guard production diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          echo "Generated diff:"
          git status --short
          unexpected=$(git status --short | grep -vE 'data/artist/(fujii_kaze|oishi_masayoshi|masayoshi_oishi)\.json|data/manifest\.json' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated paths:"
            echo "$unexpected"
            exit 1
          fi
          for p in data/artist/fujii_kaze.json data/artist/oishi_masayoshi.json data/artist/masayoshi_oishi.json data/manifest.json; do
            if git diff --quiet -- "$p"; then
              echo "Expected change missing: $p" >&2
              exit 1
            fi
          done

      - name: Commit production candidate and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/artist/fujii_kaze.json data/artist/oishi_masayoshi.json data/artist/masayoshi_oishi.json data/manifest.json
          git rm .github/workflows/tmp-compare-fujii-oishi-promotion.yml
          expected=$(printf '%s\n' .github/workflows/tmp-compare-fujii-oishi-promotion.yml data/artist/fujii_kaze.json data/artist/masayoshi_oishi.json data/artist/oishi_masayoshi.json data/manifest.json | sort)
          actual=$(git diff --cached --name-only | sort)
          test "$actual" = "$expected"
          git commit -m "release: promote Fujii Kaze recital and Oishi reviewed fixes"
          git push origin HEAD:release/fujii-oishi-20260910
          test -z "$(git status --short)"
