name: Temporary Fujii/Oishi production promotion audit

on:
  push:
    branches:
      - release/fujii-oishi-20260910
    paths:
      - '.github/workflows/tmp-compare-fujii-oishi-promotion.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify clean production checkout
        run: test -z "$(git status --short)"
      - name: Diagnose target entity differences against fixed Dev commit
        shell: bash
        run: |
          set -euo pipefail
          dev="$RUNNER_TEMP/dev"
          git clone --depth=1 --branch main https://github.com/TsubasA-lu-c/live-ticket-data-dev.git "$dev"
          test "$(git -C "$dev" rev-parse HEAD)" = "aef22c24ee720bf52fc904129e6b77644393e2cc"
          python3 - "$dev" <<'PY'
          import json, sys
          from pathlib import Path
          dev = Path(sys.argv[1])
          prod = Path('.')

          def load(root, name):
              return json.loads((root/'data'/'artist'/f'{name}.json').read_text())
          def by_id(items):
              return {x['id']: x for x in items}
          def compare_section(name, pitems, ditems):
              p, d = by_id(pitems), by_id(ditems)
              only_p = sorted(set(p)-set(d))
              only_d = sorted(set(d)-set(p))
              changed = []
              for i in sorted(set(p)&set(d)):
                  if p[i] != d[i]:
                      fields = sorted(k for k in set(p[i])|set(d[i]) if p[i].get(k) != d[i].get(k))
                      changed.append((i, fields, {k:p[i].get(k) for k in fields}, {k:d[i].get(k) for k in fields}))
              print(name, 'only production:', only_p)
              print(name, 'only dev:', only_d)
              for row in changed:
                  print(name, 'changed:', row)
              return only_p, only_d, changed

          f_prod = load(prod, 'fujii_kaze')
          f_dev = load(dev, 'fujii_kaze')
          assert set(by_id(f_dev['tours'])) - set(by_id(f_prod['tours'])) == {'fujii_kaze_piano_recital_2026'}
          assert set(by_id(f_dev['performances'])) - set(by_id(f_prod['performances'])) == {'fujii_kaze_piano_recital_2026_tokyo_1120', 'fujii_kaze_piano_recital_2026_tokyo_1121'}
          assert set(by_id(f_dev['lotteries'])) - set(by_id(f_prod['lotteries'])) == {'fujii_kaze_piano_recital_2026_general'}
          print('Fujii delta: exact recital-only addition')

          o_prod = load(prod, 'oishi_masayoshi')
          o_dev = load(dev, 'oishi_masayoshi')
          diffs = []
          for section in ('tours','performances','lotteries'):
              diffs.append(compare_section('Oishi '+section, o_prod.get(section, []), o_dev.get(section, [])))
          print('Oishi appleMusicTracks equal:', o_prod.get('appleMusicTracks', []) == o_dev.get('appleMusicTracks', []))
          print('Oishi top-level extra prod:', sorted(set(o_prod)-{'artistId','tours','performances','lotteries','appleMusicTracks'}))
          print('Oishi top-level extra dev:', sorted(set(o_dev)-{'artistId','tours','performances','lotteries','appleMusicTracks'}))
          PY
      - name: Verify production checkout stayed clean
        run: test -z "$(git status --short)"
