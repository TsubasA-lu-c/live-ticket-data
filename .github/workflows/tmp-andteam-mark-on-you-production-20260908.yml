name: 'Temporary &TEAM Mark on You production promotion'

on:
  push:
    branches:
      - 'chatgpt/andteam-mark-on-you-20260908'
    paths:
      - '.github/workflows/tmp-andteam-mark-on-you-production-20260908.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote only verified &TEAM entities
        shell: bash
        run: |
          set -euo pipefail

          echo '=== START STATUS ==='
          git status --short

          DEV_BASELINE='d738f7f18768f8b40842b54d1c923313d8e8137e'
          DEV_SOURCE='51c0d43aebe7dc615c50b202339ba7d604af7046'
          VERIFIED='2026-09-08T21:15:03+09:00'

          git clone --quiet --no-checkout https://github.com/TsubasA-lu-c/live-ticket-data-dev.git /tmp/live-ticket-data-dev
          git -C /tmp/live-ticket-data-dev cat-file -e "${DEV_BASELINE}^{commit}"
          git -C /tmp/live-ticket-data-dev cat-file -e "${DEV_SOURCE}^{commit}"

          # The Dev promotion source must contain no unrelated final-tree changes.
          mapfile -t changed < <(git -C /tmp/live-ticket-data-dev diff --name-only "$DEV_BASELINE" "$DEV_SOURCE" | sort)
          printf 'Dev source changed files:\n%s\n' "${changed[*]}"
          expected=(data/artist/and_team.json data/artists.json data/manifest.json)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          for i in "${!expected_sorted[@]}"; do
            test "${changed[$i]}" = "${expected_sorted[$i]}"
          done

          # Stop if production target files have changed independently since the reviewed baseline.
          git -C /tmp/live-ticket-data-dev show "${DEV_BASELINE}:data/artist/and_team.json" > /tmp/base-and-team.json
          git -C /tmp/live-ticket-data-dev show "${DEV_BASELINE}:data/artists.json" > /tmp/base-artists.json
          cmp -s data/artist/and_team.json /tmp/base-and-team.json || {
            echo 'STOP: production and_team.json differs from reviewed Dev baseline' >&2
            exit 1
          }
          cmp -s data/artists.json /tmp/base-artists.json || {
            echo 'STOP: production artists.json differs from reviewed Dev baseline' >&2
            exit 1
          }

          # Promote only the reviewed target files from the fixed Dev source commit.
          git -C /tmp/live-ticket-data-dev show "${DEV_SOURCE}:data/artist/and_team.json" > data/artist/and_team.json
          git -C /tmp/live-ticket-data-dev show "${DEV_SOURCE}:data/artists.json" > data/artists.json

          python3 - <<'PY'
          import hashlib
          import json
          from datetime import datetime
          from pathlib import Path

          DATA = Path('data')
          ARTIST_PATH = DATA / 'artist' / 'and_team.json'
          ARTISTS_PATH = DATA / 'artists.json'
          MANIFEST_PATH = DATA / 'manifest.json'
          TOUR_ID = 'and_team_mark_on_you_2026_2027'
          LOTTERY_ID = 'and_team_mark_on_you_2026_2027_lune_membership_fc'
          VERIFIED = '2026-09-08T21:15:03+09:00'

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def dump(path, value):
              Path(path).write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          def sha16(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()[:16]

          def parse_dt(value):
              return datetime.fromisoformat(value)

          doc = load(ARTIST_PATH)
          assert doc.get('artistId') == 'and_team'

          tours = doc.get('tours', [])
          perfs = doc.get('performances', [])
          lotteries = doc.get('lotteries', [])
          tour_by_id = {x['id']: x for x in tours}
          perf_by_id = {x['id']: x for x in perfs}
          lottery_by_id = {x['id']: x for x in lotteries}

          assert len(tour_by_id) == len(tours), 'duplicate tour IDs'
          assert len(perf_by_id) == len(perfs), 'duplicate performance IDs'
          assert len(lottery_by_id) == len(lotteries), 'duplicate lottery IDs'
          assert TOUR_ID in tour_by_id
          assert LOTTERY_ID in lottery_by_id

          target_perf_ids = [pid for pid in perf_by_id if pid.startswith('and_team_mark_on_you_2026_2027_')]
          assert len(target_perf_ids) == 41, f'expected 41 Mark on You performances, got {len(target_perf_ids)}'

          for perf in perfs:
              assert perf.get('tourId') in tour_by_id, f"unknown tourId: {perf.get('tourId')}"
              if perf.get('doorOpenAt') and perf.get('performanceAt'):
                  assert parse_dt(perf['doorOpenAt']) < parse_dt(perf['performanceAt'])

          for lottery in lotteries:
              if lottery.get('tourId') is not None:
                  assert lottery['tourId'] in tour_by_id, f"unknown lottery tourId: {lottery['tourId']}"
              ids = lottery.get('performanceIds')
              if ids is not None:
                  assert len(ids) == len(set(ids)), f"duplicate performanceIds in {lottery['id']}"
                  assert all(pid in perf_by_id for pid in ids), f"unknown performanceId in {lottery['id']}"

          target = lottery_by_id[LOTTERY_ID]
          assert target['entryStartAt'] == '2026-09-07T13:00:00+09:00'
          assert target['entryEndAt'] == '2026-09-13T23:59:00+09:00'
          assert target['resultAt'] == '2026-09-18T11:00:00+09:00'
          assert target['paymentStartAt'] == '2026-09-18T11:00:00+09:00'
          assert target['paymentEndAt'] == '2026-09-21T23:00:00+09:00'
          assert len(target['performanceIds']) == 28
          assert all('2027_02' not in pid and '2027_03' not in pid for pid in target['performanceIds'])
          assert parse_dt(target['entryStartAt']) < parse_dt(target['entryEndAt']) < parse_dt(target['resultAt'])
          assert parse_dt(target['resultAt']) == parse_dt(target['paymentStartAt']) < parse_dt(target['paymentEndAt'])

          # Artist-level source remains the official homepage seed.
          artists = load(ARTISTS_PATH)
          artist_ids = [a.get('id') for a in artists]
          assert len(artist_ids) == len(set(artist_ids)), 'duplicate artist IDs'
          matches = [a for a in artists if a.get('id') == 'and_team']
          assert len(matches) == 1
          assert matches[0].get('sourceUrl') == 'https://www.andteam-official.jp/'
          assert matches[0].get('lastVerifiedAt') == VERIFIED

          # Validate every artist JSON parses and its own IDs are internally unique.
          for fp in sorted((DATA / 'artist').glob('*.json')):
              item = load(fp)
              for key in ('tours', 'performances', 'lotteries'):
                  values = item.get(key, []) or []
                  ids = [x.get('id') for x in values if isinstance(x, dict) and x.get('id') is not None]
                  assert len(ids) == len(set(ids)), f'duplicate {key} IDs in {fp}'

          # Production manifest is derived from current production, never copied from Dev.
          manifest = load(MANIFEST_PATH)
          assert manifest.get('version') == 187, f"unexpected production manifest version: {manifest.get('version')}"
          manifest['version'] = 188
          manifest['updatedAt'] = VERIFIED
          manifest.setdefault('files', {}).setdefault('artists', {})['hash'] = sha16(ARTISTS_PATH)

          artist_hashes = {fp.stem: sha16(fp) for fp in sorted((DATA / 'artist').glob('*.json'))}
          manifest.setdefault('artists', {})
          for aid, digest in artist_hashes.items():
              manifest['artists'].setdefault(aid, {})['hash'] = digest
          for aid in list(manifest['artists']):
              if aid not in artist_hashes:
                  del manifest['artists'][aid]
          dump(MANIFEST_PATH, manifest)

          check = load(MANIFEST_PATH)
          assert check['version'] == 188
          assert check['files']['artists']['hash'] == sha16(ARTISTS_PATH)
          assert check['artists']['and_team']['hash'] == sha16(ARTIST_PATH)
          assert set(check['artists']) == set(artist_hashes)
          print('validated production promotion: 1 tour, 41 performances, 1 FC lottery; manifest v188')
          PY

          git diff --check
          echo '=== TARGET STATUS ==='
          status="$(git status --short)"
          printf '%s\n' "$status"
          unexpected="$(printf '%s\n' "$status" | awk '{print $2}' | grep -v -E '^(data/artist/and_team.json|data/artists.json|data/manifest.json)$' || true)"
          test -z "$unexpected" || { echo "Unexpected changes: $unexpected" >&2; exit 1; }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/artist/and_team.json data/artists.json data/manifest.json
          git commit -m 'data: promote &TEAM Mark on You tour and FC presale'
          git push origin HEAD:${GITHUB_REF_NAME}

          echo '=== END STATUS ==='
          git status --short
