name: Temporary aiko production promotion

on:
  push:
    branches:
      - release/aiko-prod-20260829
    paths:
      - '.github/workflows/temp-aiko-prod-promotion.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check initial production tree
        run: git status --short

      - name: Load audited dev data and inspect drift
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/dev-data"
          git clone --depth=1 --branch main https://github.com/TsubasA-lu-c/live-ticket-data-dev.git "$RUNNER_TEMP/dev-data"
          echo '=== dev vs production data differences before promotion ==='
          diff -qr data "$RUNNER_TEMP/dev-data/data" || true

      - name: Promote only aiko
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import hashlib, json, shutil

          root = Path('.')
          dev = Path(__import__('os').environ['RUNNER_TEMP']) / 'dev-data'

          prod_artists_path = root / 'data/artists.json'
          dev_artists_path = dev / 'data/artists.json'
          prod_artists = json.loads(prod_artists_path.read_text(encoding='utf-8'))
          dev_artists = json.loads(dev_artists_path.read_text(encoding='utf-8'))

          if any(x.get('id') == 'aiko' for x in prod_artists):
              raise SystemExit('production already contains aiko; abort for manual review')
          aiko_entry = next(x for x in dev_artists if x.get('id') == 'aiko')

          dev_ids = [x.get('id') for x in dev_artists]
          aiko_index = dev_ids.index('aiko')
          prod_ids = [x.get('id') for x in prod_artists]
          insert_at = len(prod_artists)
          for candidate in reversed(dev_ids[:aiko_index]):
              if candidate in prod_ids:
                  insert_at = prod_ids.index(candidate) + 1
                  break
          prod_artists.insert(insert_at, aiko_entry)
          prod_artists_path.write_text(json.dumps(prod_artists, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          src = dev / 'data/artist/aiko.json'
          dst = root / 'data/artist/aiko.json'
          dst.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(src, dst)

          manifest_path = root / 'data/manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          now = datetime.now(timezone(timedelta(hours=9))).isoformat(timespec='seconds')
          manifest['version'] = int(manifest['version']) + 1
          manifest['updatedAt'] = now
          manifest.setdefault('files', {}).setdefault('artists', {})['hash'] = hashlib.sha256(prod_artists_path.read_bytes()).hexdigest()[:16]
          manifest.setdefault('artists', {})['aiko'] = {'hash': hashlib.sha256(dst.read_bytes()).hexdigest()[:16]}
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate production payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          for path in Path('data').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))

          artists = json.loads(Path('data/artists.json').read_text(encoding='utf-8'))
          ids = [x['id'] for x in artists]
          assert len(ids) == len(set(ids)), 'duplicate artist id'
          files = {p.stem for p in Path('data/artist').glob('*.json')}
          assert set(ids) == files, (len(ids), len(files), sorted(set(ids)^files)[:20])

          a = next(x for x in artists if x['id'] == 'aiko')
          assert a['aliases'] == ['アイコ']
          assert a['appleMusic']['artistId'] == '635154255'
          assert a['appleMusic'].get('imageUrl')

          d = json.loads(Path('data/artist/aiko.json').read_text(encoding='utf-8'))
          assert len(d['performances']) == 48
          assert len(d['lotteries']) == 26
          assert len(d.get('appleMusicTracks') or []) == 3
          perf = {x['id'] for x in d['performances']}
          lot_ids = [x['id'] for x in d['lotteries']]
          assert len(lot_ids) == len(set(lot_ids))
          for x in d['lotteries']:
              assert x['id'].startswith(x['tourId'] + '_'), x['id']
              assert all(pid in perf for pid in x['performanceIds']), x['id']
              assert x['sourceUrl'].startswith('https://'), x['id']

          byid = {x['id']: x for x in d['lotteries']}
          album = byid['aiko_llp26_2026_2027_album17_added']
          assert album['resultAt'] == '2026-10-02T13:00:00+09:00'
          assert album['sourceUrl'] == 'https://news.ponycanyon.co.jp/2026/08/125032'
          eplus = byid['aiko_llp26_2026_2027_eplus_preorder_aichi']
          assert eplus['entryStartAt'] == '2026-08-26T12:00:00+09:00'
          assert eplus['entryEndAt'] == '2026-09-06T23:59:00+09:00'
          assert eplus['resultAt'] is None and eplus['paymentStartAt'] is None and eplus['paymentEndAt'] is None

          manifest = json.loads(Path('data/manifest.json').read_text(encoding='utf-8'))
          assert manifest['files']['artists']['hash'] == hashlib.sha256(Path('data/artists.json').read_bytes()).hexdigest()[:16]
          for aid in ids:
              expected = hashlib.sha256(Path(f'data/artist/{aid}.json').read_bytes()).hexdigest()[:16]
              assert manifest['artists'][aid]['hash'] == expected, aid
          print(json.dumps({'artists': len(ids), 'aikoPerformances': 48, 'aikoLotteries': 26, 'appleMusicTracks': 3, 'manifestVersion': manifest['version']}, ensure_ascii=False))
          PY

          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' data/artist/aiko.json data/artists.json data/manifest.json | sort)"
          test "$changed" = "$expected" || { echo 'Unexpected production diff:'; echo "$changed"; exit 1; }
          git diff --check
          git status --short
          git diff --stat

      - name: Commit production promotion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/artist/aiko.json data/artists.json data/manifest.json
          git commit -m 'release: add audited aiko data'
          git push origin HEAD:release/aiko-prod-20260829
          git status --short
