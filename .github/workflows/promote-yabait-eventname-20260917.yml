name: Promote Yabai Nara correction

on:
  push:
    branches:
      - release/yabait-eventname-20260917

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/yabait-eventname-20260917
          fetch-depth: 0
          clean: true

      - name: Upsert approved Yabai entities and rebuild manifest
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git log -1 --pretty=%s)" = "chore: stage Yabai production promotion" ] || exit 0
          echo 'Before:'
          git status --short
          python3 - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          artist_path = Path('data/artist/yabai_tshirts_yasan.json')
          manifest_path = Path('data/manifest.json')
          data = json.loads(artist_path.read_text(encoding='utf-8'))
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))

          tour_id = 'yabai_tshirts_yasan_oitemo_youngskinny_vol7_2027_0204'
          perf_id = 'yabai_tshirts_yasan_oitemo_youngskinny_vol7_2027_nara_0204'
          lottery_id = 'yabai_tshirts_yasan_oitemo_youngskinny_vol7_2027_prerequest2'
          source_url = 'https://yabaitshirtsyasan.com/live/293577/'
          event_name = '老いてもヤングスキニーツアー vol.7'
          now = datetime.now(timezone(timedelta(hours=9))).strftime('%Y-%m-%dT%H:%M:%S+09:00')

          tours = data.setdefault('tours', [])
          tour_matches = [x for x in tours if x.get('id') == tour_id]
          if len(tour_matches) != 1:
              raise SystemExit(f'expected exactly one production tour {tour_id}, found {len(tour_matches)}')
          tour = tour_matches[0]
          # Preserve identity/dates/title, upsert only fields verified for this approved entity.
          assert tour.get('artistId') == 'yabai_tshirts_yasan'
          assert tour.get('title') == 'ヤングスキニー「老いてもヤングスキニーツアー vol.7」'
          assert tour.get('startDate') == '2027-02-04T00:00:00+09:00'
          assert tour.get('endDate') == '2027-02-04T00:00:00+09:00'
          tour['prices'] = [{'label': '前売', 'amount': 5500}]
          tour['source'] = 'system'
          tour['sourceUrl'] = source_url
          tour['lastVerifiedAt'] = now

          approved_perf = {
              'id': perf_id,
              'tourId': tour_id,
              'venue': 'EVANS CASTLE HALL',
              'performanceAt': '2027-02-04T19:00:00+09:00',
              'doorOpenAt': '2027-02-04T18:15:00+09:00',
              'kind': 'taiban',
              'eventName': event_name,
              'source': 'system',
              'sourceUrl': source_url,
              'lastVerifiedAt': now,
          }
          performances = data.setdefault('performances', [])
          pm = [x for x in performances if x.get('id') == perf_id]
          if len(pm) > 1:
              raise SystemExit(f'duplicate performance {perf_id}')
          if pm:
              pm[0].update(approved_perf)
          else:
              performances.append(approved_perf)

          approved_lottery = {
              'id': lottery_id,
              'tourId': tour_id,
              'type': 'プレリクエスト2次先行',
              'entryStartAt': '2026-08-21T12:00:00+09:00',
              'entryEndAt': '2026-09-01T23:59:00+09:00',
              'resultAt': None,
              'paymentStartAt': None,
              'paymentEndAt': None,
              'performanceIds': [perf_id],
              'source': 'system',
              'sourceUrl': source_url,
              'lastVerifiedAt': now,
          }
          lotteries = data.setdefault('lotteries', [])
          lm = [x for x in lotteries if x.get('id') == lottery_id]
          if len(lm) > 1:
              raise SystemExit(f'duplicate lottery {lottery_id}')
          if lm:
              lm[0].update(approved_lottery)
          else:
              lotteries.append(approved_lottery)

          artist_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          manifest['version'] = int(manifest.get('version', 0)) + 1
          manifest['updatedAt'] = now
          manifest.setdefault('artists', {}).setdefault('yabai_tshirts_yasan', {})['hash'] = hashlib.sha256(artist_path.read_bytes()).hexdigest()[:16]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate production promotion scope
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git log -1 --pretty=%s)" = "chore: stage Yabai production promotion" ] || exit 0
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          for p in Path('data').rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))

          artist_path = Path('data/artist/yabai_tshirts_yasan.json')
          d = json.loads(artist_path.read_text(encoding='utf-8'))
          tour_id = 'yabai_tshirts_yasan_oitemo_youngskinny_vol7_2027_0204'
          perf_id = 'yabai_tshirts_yasan_oitemo_youngskinny_vol7_2027_nara_0204'
          lottery_id = 'yabai_tshirts_yasan_oitemo_youngskinny_vol7_2027_prerequest2'

          tours = [x for x in d['tours'] if x.get('id') == tour_id]
          perfs = [x for x in d['performances'] if x.get('id') == perf_id]
          lots = [x for x in d['lotteries'] if x.get('id') == lottery_id]
          assert len(tours) == len(perfs) == len(lots) == 1
          assert tours[0].get('prices') == [{'label': '前売', 'amount': 5500}]
          assert perfs[0].get('kind') == 'taiban'
          assert perfs[0].get('eventName') == '老いてもヤングスキニーツアー vol.7'
          assert perfs[0].get('venue') == 'EVANS CASTLE HALL'
          assert lots[0].get('performanceIds') == [perf_id]

          tour_ids = [x.get('id') for x in d.get('tours', [])]
          perf_ids = [x.get('id') for x in d.get('performances', [])]
          lot_ids = [x.get('id') for x in d.get('lotteries', [])]
          assert len(tour_ids) == len(set(tour_ids))
          assert len(perf_ids) == len(set(perf_ids))
          assert len(lot_ids) == len(set(lot_ids))
          assert all(x.get('tourId') in set(tour_ids) for x in d.get('performances', []))
          assert all(x.get('tourId') in set(tour_ids) for x in d.get('lotteries', []))
          assert all(pid in set(perf_ids) for x in d.get('lotteries', []) for pid in (x.get('performanceIds') or []))
          assert all(x.get('eventName') for x in d.get('performances', []) if x.get('kind') in {'taiban','fes'})

          manifest = json.loads(Path('data/manifest.json').read_text(encoding='utf-8'))
          expected = hashlib.sha256(artist_path.read_bytes()).hexdigest()[:16]
          assert manifest['artists']['yabai_tshirts_yasan']['hash'] == expected
          PY
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'data/artist/yabai_tshirts_yasan.json\ndata/manifest.json'

      - name: Commit production promotion
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git log -1 --pretty=%s)" = "chore: stage Yabai production promotion" ] || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/artist/yabai_tshirts_yasan.json data/manifest.json
          git commit -m 'release: promote Yabai Nara event correction'
          echo 'After commit:'
          git status --short
          git push origin HEAD:release/yabait-eventname-20260917
