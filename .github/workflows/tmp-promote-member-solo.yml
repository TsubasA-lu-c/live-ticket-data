name: Temporary member-solo production promotion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-promote-member-solo.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote verified Dev member-solo data
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import urllib.request
          from pathlib import Path

          DATA = Path('data')
          DEV_SHA = '6b3411c7e1805462183511b7952c4024d304693b'
          UPDATED_AT = '2026-09-04T06:55:00+09:00'

          def sha16(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()[:16]

          manifest_path = DATA / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))

          # Stop before writes if production moved independently from the reviewed baseline.
          assert manifest.get('version') == 184, f"unexpected production manifest version: {manifest.get('version')}"
          assert manifest['artists']['golden_bomber']['hash'] == '07c98fb3a8b77780', 'golden_bomber changed independently'
          assert manifest['artists']['shinee']['hash'] == 'b08a6e3cfa2b97f3', 'shinee changed independently'

          targets = {
              'golden_bomber': '6c146b602bac9ec1',
              'shinee': '746bd9c4061c4529',
          }

          for artist_id, expected_hash in targets.items():
              url = f'https://raw.githubusercontent.com/TsubasA-lu-c/live-ticket-data-dev/{DEV_SHA}/data/artist/{artist_id}.json'
              with urllib.request.urlopen(url, timeout=30) as response:
                  raw = response.read()
              doc = json.loads(raw.decode('utf-8'))
              assert doc.get('artistId') == artist_id
              tours = doc.get('tours') or []
              perfs = doc.get('performances') or []
              lots = doc.get('lotteries') or []
              tour_ids = [x.get('id') for x in tours]
              perf_ids = [x.get('id') for x in perfs]
              lot_ids = [x.get('id') for x in lots]
              assert len(tour_ids) == len(set(tour_ids)), f'duplicate tour ids: {artist_id}'
              assert len(perf_ids) == len(set(perf_ids)), f'duplicate performance ids: {artist_id}'
              assert len(lot_ids) == len(set(lot_ids)), f'duplicate lottery ids: {artist_id}'
              tour_set = set(tour_ids)
              perf_set = set(perf_ids)
              assert all(p.get('tourId') in tour_set for p in perfs), f'bad performance tour ref: {artist_id}'
              assert all(l.get('tourId') in tour_set for l in lots), f'bad lottery tour ref: {artist_id}'
              assert all(pid in perf_set for l in lots for pid in (l.get('performanceIds') or [])), f'bad lottery performance ref: {artist_id}'

              path = DATA / 'artist' / f'{artist_id}.json'
              path.write_bytes(raw)
              actual_hash = sha16(path)
              assert actual_hash == expected_hash, f'{artist_id} hash mismatch: {actual_hash}'
              manifest['artists'][artist_id]['hash'] = actual_hash

          # Regression guard: TETSUYA must not be introduced by this promotion.
          artists = json.loads((DATA / 'artists.json').read_text(encoding='utf-8'))
          assert not any(a.get('id') == 'tetsuya' for a in artists), 'TETSUYA must remain out of production targets'
          assert not (DATA / 'artist' / 'tetsuya.json').exists(), 'TETSUYA file must not be promoted'

          manifest['version'] = 185
          manifest['updatedAt'] = UPDATED_AT
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          assert manifest['artists']['golden_bomber']['hash'] == '6c146b602bac9ec1'
          assert manifest['artists']['shinee']['hash'] == '746bd9c4061c4529'
          print('Production member-solo promotion validation passed')
          PY
      - name: Commit production data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/artist/golden_bomber.json data/artist/shinee.json data/manifest.json
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "data/artist/golden_bomber.json data/artist/shinee.json data/manifest.json "
          git diff --cached --check
          git commit -m 'release: promote member solo activity display'
          git push
