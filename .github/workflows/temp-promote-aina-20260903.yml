name: One-shot Aina the End production promotion

on:
  push:
    paths:
      - '.github/workflows/temp-promote-aina-20260903.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote pinned Aina the End data
        shell: bash
        run: |
          set -euo pipefail
          echo '--- git status before ---'
          git status --short
          git pull --ff-only origin main

          python3 - <<'PY'
          import copy
          import hashlib
          import json
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          DEV_COMMIT = '18f9692e853af81bc39ae5e2feacdf2e4b59d2a1'
          EXPECTED_DEV_ARTIST_HASH = 'edc2640077783cab'
          ARTIST_ID = 'aina_the_end'

          artist_path = Path(f'data/artist/{ARTIST_ID}.json')
          artists_path = Path('data/artists.json')
          manifest_path = Path('data/manifest.json')

          def fetch_dev(path):
              url = f'https://raw.githubusercontent.com/TsubasA-lu-c/live-ticket-data-dev/{DEV_COMMIT}/{path}'
              with urllib.request.urlopen(url, timeout=30) as response:
                  return response.read()

          dev_artist_bytes = fetch_dev(f'data/artist/{ARTIST_ID}.json')
          dev_artist_hash = hashlib.sha256(dev_artist_bytes).hexdigest()[:16]
          assert dev_artist_hash == EXPECTED_DEV_ARTIST_HASH, (dev_artist_hash, EXPECTED_DEV_ARTIST_HASH)
          dev_artist = json.loads(dev_artist_bytes.decode('utf-8'))
          dev_artists = json.loads(fetch_dev('data/artists.json').decode('utf-8'))
          dev_manifest = json.loads(fetch_dev('data/manifest.json').decode('utf-8'))
          assert dev_manifest['artists'][ARTIST_ID]['hash'] == EXPECTED_DEV_ARTIST_HASH

          prod_artist_before = json.loads(artist_path.read_text(encoding='utf-8'))
          prod_artists = json.loads(artists_path.read_text(encoding='utf-8'))
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest_before = copy.deepcopy(manifest)
          prod_artists_before = copy.deepcopy(prod_artists)

          assert prod_artist_before['artistId'] == ARTIST_ID
          assert dev_artist['artistId'] == ARTIST_ID
          assert prod_artist_before.get('appleMusicTracks') == dev_artist.get('appleMusicTracks'), 'unexpected Apple Music track drift'

          def find_artist(items, artist_id):
              for index, item in enumerate(items):
                  if item.get('id') == artist_id:
                      return index, item
              raise AssertionError(f'missing artist: {artist_id}')

          prod_idx, prod_registry_item = find_artist(prod_artists, ARTIST_ID)
          _, dev_registry_item = find_artist(dev_artists, ARTIST_ID)
          prod_registry_without_verified = {k: v for k, v in prod_registry_item.items() if k != 'lastVerifiedAt'}
          dev_registry_without_verified = {k: v for k, v in dev_registry_item.items() if k != 'lastVerifiedAt'}
          assert prod_registry_without_verified == dev_registry_without_verified, 'unexpected registry drift outside lastVerifiedAt'
          prod_artists[prod_idx] = dev_registry_item

          # Promote the exact validated artist payload from the pinned Dev commit.
          artist_path.write_text(json.dumps(dev_artist, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          artists_path.write_text(json.dumps(prod_artists, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Target-specific structural validation.
          data = json.loads(artist_path.read_text(encoding='utf-8'))
          tour_ids = [x['id'] for x in data['tours']]
          perf_ids = [x['id'] for x in data['performances']]
          lottery_ids = [x['id'] for x in data['lotteries']]
          assert (len(data['tours']), len(data['performances']), len(data['lotteries'])) == (15, 25, 17)
          assert len(tour_ids) == len(set(tour_ids))
          assert len(perf_ids) == len(set(perf_ids))
          assert len(lottery_ids) == len(set(lottery_ids))
          tour_set, perf_set = set(tour_ids), set(perf_ids)
          for perf in data['performances']:
              assert perf['tourId'] in tour_set
              assert perf.get('kind') in {'oneman', 'fes', 'taiban'}
              if perf.get('kind') in {'fes', 'taiban'}:
                  assert perf.get('eventName')
          for lottery in data['lotteries']:
              assert lottery['tourId'] in tour_set
              assert 'performanceIds' in lottery
              if lottery['performanceIds'] is not None:
                  assert lottery['performanceIds']
                  assert set(lottery['performanceIds']) <= perf_set
              for key in ('entryStartAt', 'entryEndAt', 'resultAt', 'paymentStartAt', 'paymentEndAt'):
                  assert key in lottery

          tours = {x['id']: x for x in data['tours']}
          perfs = {x['id']: x for x in data['performances']}
          lots = {x['id']: x for x in data['lotteries']}
          assert 'aina_the_end_mtv_vmaj_2026' in tours
          assert perfs['aina_the_end_mtv_vmaj_2026_tokyo_1029']['venue'] == '東京ドーム'
          assert perfs['aina_the_end_mtv_vmaj_2026_tokyo_1029']['performanceAt'] == '2026-10-29T18:00:00+09:00'
          assert perfs['aina_the_end_mtv_vmaj_2026_tokyo_1029']['doorOpenAt'] == '2026-10-29T16:00:00+09:00'
          assert lots['aina_the_end_mtv_vmaj_2026_official']['resultAt'] == '2026-09-03T18:00:00+09:00'
          assert perfs['aina_the_end_sound_connection_2026_kobe_1027']['kind'] == 'taiban'
          assert perfs['aina_the_end_1chance_festival_2026_kumamoto_0926']['performanceAt'] == '2026-09-26T11:30:00+09:00'
          assert perfs['aina_the_end_music_expo_live_2026_taipei_1024']['performanceAt'] == '2026-10-24T18:00:00+08:00'

          # Ensure only the Aina registry object changed in artists.json.
          for before_item, after_item in zip(prod_artists_before, prod_artists):
              if before_item.get('id') != ARTIST_ID:
                  assert before_item == after_item
          assert len(prod_artists_before) == len(prod_artists)

          # Parse every production JSON before publishing.
          for path in sorted(Path('data').rglob('*.json')):
              json.loads(path.read_text(encoding='utf-8'))

          old_version = int(manifest.get('version', 0))
          manifest['version'] = old_version + 1
          jst = timezone(timedelta(hours=9))
          manifest['updatedAt'] = datetime.now(jst).strftime('%Y-%m-%dT%H:%M:%S+09:00')
          manifest.setdefault('files', {}).setdefault('artists', {})['hash'] = hashlib.sha256(artists_path.read_bytes()).hexdigest()[:16]
          manifest.setdefault('artists', {}).setdefault(ARTIST_ID, {})['hash'] = hashlib.sha256(artist_path.read_bytes()).hexdigest()[:16]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          reread_manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert reread_manifest['version'] == old_version + 1
          assert reread_manifest['files']['artists']['hash'] == hashlib.sha256(artists_path.read_bytes()).hexdigest()[:16]
          assert reread_manifest['artists'][ARTIST_ID]['hash'] == EXPECTED_DEV_ARTIST_HASH

          # No unrelated manifest entries may change.
          expected = copy.deepcopy(manifest_before)
          expected['version'] = reread_manifest['version']
          expected['updatedAt'] = reread_manifest['updatedAt']
          expected.setdefault('files', {}).setdefault('artists', {})['hash'] = reread_manifest['files']['artists']['hash']
          expected.setdefault('artists', {}).setdefault(ARTIST_ID, {})['hash'] = EXPECTED_DEV_ARTIST_HASH
          assert expected == reread_manifest

          print(f'production manifest: {old_version} -> {reread_manifest["version"]}')
          print(f'{ARTIST_ID}: {len(data["tours"])} tours, {len(data["performances"])} performances, {len(data["lotteries"])} lotteries')
          print(f'{ARTIST_ID} hash: {EXPECTED_DEV_ARTIST_HASH}')
          PY

          git diff --check
          echo '--- production diff stat ---'
          git diff --stat -- data/artist/aina_the_end.json data/artists.json data/manifest.json
          echo '--- git status before commit ---'
          git status --short

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/temp-promote-aina-20260903.yml
          git add -- data/artist/aina_the_end.json data/artists.json data/manifest.json

          mapfile -t staged < <(git diff --cached --name-only)
          printf '%s\n' "${staged[@]}"
          test "${#staged[@]}" -eq 4
          printf '%s\n' "${staged[@]}" | grep -Fx '.github/workflows/temp-promote-aina-20260903.yml'
          printf '%s\n' "${staged[@]}" | grep -Fx 'data/artist/aina_the_end.json'
          printf '%s\n' "${staged[@]}" | grep -Fx 'data/artists.json'
          printf '%s\n' "${staged[@]}" | grep -Fx 'data/manifest.json'

          git commit -m 'release: promote Aina the End live refresh' -m 'Promote only the validated Aina the End payload from Dev commit 18f9692e853af81bc39ae5e2feacdf2e4b59d2a1. Includes MTV VMAJ 2026 and verified ticket/event corrections; production diff is limited to Aina data, the Aina registry timestamp, and manifest hashes.'
          git push origin HEAD:main

          echo '--- git status after ---'
          git status --short
