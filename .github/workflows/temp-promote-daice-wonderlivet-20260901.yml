name: One-shot promote Da-iCE WONDERLIVET

on:
  push:
    branches:
      - chatgpt/promote-daice-wonderlivet-20260901
    paths:
      - .github/workflows/temp-promote-daice-wonderlivet-20260901.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact validated Dev data and refresh manifest
        shell: bash
        run: |
          set -euo pipefail
          baseline='01ca1011eb74da82580aec78d1828e2a09437612'
          dev_sha='79d5947ebc455a35557721cdab047a7940d105a4'
          expected_hash='c4d1a5bba9951fe2'
          workflow='.github/workflows/temp-promote-daice-wonderlivet-20260901.yml'

          echo '--- branch state before promotion ---'
          git status --short
          git cat-file -e "${baseline}^{commit}"
          mapfile -t pre_changed < <(git diff --name-only "${baseline}..HEAD")
          printf '%s\n' "${pre_changed[@]}"
          test "${#pre_changed[@]}" -eq 1
          test "${pre_changed[0]}" = "$workflow"

          curl -fsSL \
            "https://raw.githubusercontent.com/TsubasA-lu-c/live-ticket-data-dev/${dev_sha}/data/artist/da_ice.json" \
            -o /tmp/da_ice.json

          EXPECTED_HASH="$expected_hash" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p = Path('/tmp/da_ice.json')
          json.loads(p.read_text(encoding='utf-8'))
          digest = hashlib.sha256(p.read_bytes()).hexdigest()[:16]
          expected = os.environ['EXPECTED_HASH']
          print('downloaded Da-iCE hash:', digest)
          if digest != expected:
              raise SystemExit(f'[ERROR] Da-iCE hash mismatch: {digest} != {expected}')
          PY

          cp /tmp/da_ice.json data/artist/da_ice.json

          python3 - <<'PY'
          import hashlib, json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          data_dir = Path('data')
          manifest_path = data_dir / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('version') != 179:
              raise SystemExit(f"[ERROR] expected production manifest 179, got {manifest.get('version')}")

          def h16(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()[:16]

          manifest['version'] = 180
          jst = timezone(timedelta(hours=9))
          manifest['updatedAt'] = datetime.now(jst).strftime('%Y-%m-%dT%H:%M:%S+09:00')
          manifest.setdefault('files', {}).setdefault('artists', {})['hash'] = h16(data_dir / 'artists.json')

          hashes = {p.stem: h16(p) for p in sorted((data_dir / 'artist').glob('*.json'))}
          artists = manifest.setdefault('artists', {})
          for artist_id, digest in hashes.items():
              artists.setdefault(artist_id, {})['hash'] = digest
          for artist_id in list(artists):
              if artist_id not in hashes:
                  del artists[artist_id]

          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('manifest version: 179 -> 180')
          print('manifest updatedAt:', manifest['updatedAt'])
          print('Da-iCE hash:', artists['da_ice']['hash'])
          PY

          git diff --check

          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          p = Path('data/artist/da_ice.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          lot = next(x for x in data['lotteries'] if x['id'] == 'da_ice_wonderlivet_2026_general')
          assert lot['type'] == 'WONDERLIVET 最速先行（チケットぴあ）'
          assert lot['entryStartAt'] == '2026-09-01T20:00:00+09:00'
          assert lot['entryEndAt'] == '2026-09-23T23:59:00+09:00'
          assert lot['sourceUrl'] == 'https://t.pia.jp/pia/event/event.do?eventBundleCd=b2670719'
          perf = next(x for x in data['performances'] if x['id'] == 'da_ice_wonderlivet_2026_1120')
          assert perf['performanceDate'] == '2026-11-20'
          assert perf['performanceTimeEstimated'] is True
          digest = hashlib.sha256(p.read_bytes()).hexdigest()[:16]
          assert digest == 'c4d1a5bba9951fe2'
          manifest = json.loads(Path('data/manifest.json').read_text(encoding='utf-8'))
          assert manifest['version'] == 180
          assert manifest['artists']['da_ice']['hash'] == digest
          print('promotion assertions: OK')
          PY

          mapfile -t data_changed < <(git diff --name-only -- data)
          printf '%s\n' "${data_changed[@]}"
          test "${#data_changed[@]}" -eq 2
          test "${data_changed[0]}" = 'data/artist/da_ice.json'
          test "${data_changed[1]}" = 'data/manifest.json'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/artist/da_ice.json data/manifest.json
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" -eq 2
          git commit -m 'release: stage Da-iCE WONDERLIVET production data'
          git push origin HEAD:chatgpt/promote-daice-wonderlivet-20260901

          echo '--- final status ---'
          git status --short
