name: Promote new artists and kana aliases 20260828

on:
  push:
    branches:
      - release/new-artists-kana-20260828

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/new-artists-kana-20260828
          fetch-depth: 0

      - name: Confirm clean production branch
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          test "$(git rev-parse origin/main)" = "471a2c96b0f5f944ed6b2a28765b4711474ae126"

      - name: Fetch reviewed dev data
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/TsubasA-lu-c/live-ticket-data-dev.git /tmp/live-ticket-data-dev
          test "$(git -C /tmp/live-ticket-data-dev rev-parse HEAD)" = "d43159fbebe320373ac5a95ed2f4a5c3a31a98f7"

      - name: Apply selected production promotion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import re
          import shutil
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          root = Path('.')
          dev = Path('/tmp/live-ticket-data-dev')
          artists_path = root / 'data/artists.json'
          manifest_path = root / 'data/manifest.json'

          new_ids = [
              'bullet_train', 'illit', 'one_n_only', 'candy_tune', 'boynextdoor',
              'saucy_dog', 'ateez', 'niziu', 'xg', 'nakajima_kento',
          ]
          existing_alias_additions = {
              'glay': ['グレイ'],
              'ryokuoushoku_shakai': ['リョクオウショクシャカイ'],
              'tennimu': ['テニスノオウジサマミュージカル'],
              'zutomayo': ['ズットマヨナカデイイノニ'],
              'momoiro_clover_z': ['モモイロクローバーゼット'],
              'boku_aozora': ['ボクガミタカッタアオゾラ'],
          }

          prod_artists = json.loads(artists_path.read_text(encoding='utf-8'))
          dev_artists = json.loads((dev / 'data/artists.json').read_text(encoding='utf-8'))
          prod_by_id = {a['id']: a for a in prod_artists}
          dev_by_id = {a['id']: a for a in dev_artists}

          missing_existing = sorted(set(existing_alias_additions) - set(prod_by_id))
          if missing_existing:
              raise SystemExit(f'production missing existing alias targets: {missing_existing}')
          unexpected_existing = sorted(set(new_ids) & set(prod_by_id))
          if unexpected_existing:
              raise SystemExit(f'new artist ids already exist in production: {unexpected_existing}')
          missing_dev = sorted(set(new_ids) - set(dev_by_id))
          if missing_dev:
              raise SystemExit(f'dev missing expected new artists: {missing_dev}')

          for aid, aliases in existing_alias_additions.items():
              current = prod_by_id[aid].setdefault('aliases', [])
              for alias in aliases:
                  if alias not in current:
                      current.append(alias)

          for entry in dev_artists:
              if entry['id'] in new_ids:
                  prod_artists.append(entry)

          artists_path.write_text(
              json.dumps(prod_artists, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          for aid in new_ids:
              src = dev / 'data/artist' / f'{aid}.json'
              dst = root / 'data/artist' / f'{aid}.json'
              if dst.exists():
                  raise SystemExit(f'refusing to overwrite production artist file: {dst}')
              shutil.copy2(src, dst)

          def sha16(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()[:16]

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = int(manifest['version']) + 1
          manifest['updatedAt'] = datetime.now(timezone(timedelta(hours=9))).isoformat(timespec='seconds')
          manifest['files']['artists']['hash'] = sha16(artists_path)
          manifest.setdefault('artists', {})
          for aid in new_ids:
              manifest['artists'][aid] = {'hash': sha16(root / 'data/artist' / f'{aid}.json')}
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          kana = re.compile(r'[\u3041-\u3096\u30A1-\u30FA]')
          latin_or_cjk = re.compile(r'[A-Za-z\u3400-\u4DBF\u4E00-\u9FFF]')
          missing_kana = []
          for entry in prod_artists:
              aliases = entry.get('aliases') or []
              if latin_or_cjk.search(entry['name']) and not any(isinstance(a, str) and kana.search(a) for a in aliases):
                  missing_kana.append((entry['id'], entry['name'], aliases))
          if missing_kana:
              for row in missing_kana:
                  print('MISSING_KANA_ALIAS', row)
              raise SystemExit(f'{len(missing_kana)} production artists have no kana alias')

          for aid in new_ids:
              data = json.loads((root / 'data/artist' / f'{aid}.json').read_text(encoding='utf-8'))
              assert data['artistId'] == aid
              assert isinstance(data.get('tours'), list)
              assert isinstance(data.get('performances'), list)
              assert isinstance(data.get('lotteries'), list)
              entry = next(a for a in prod_artists if a['id'] == aid)
              assert entry.get('appleMusic', {}).get('imageUrl'), f'{aid}: missing Apple Music image'

          if 'koshi_inaba' in {a['id'] for a in prod_artists}:
              raise SystemExit('unrelated dev-only koshi_inaba was introduced')

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert manifest['files']['artists']['hash'] == sha16(artists_path)
          for aid in new_ids:
              assert manifest['artists'][aid]['hash'] == sha16(root / 'data/artist' / f'{aid}.json')

          print(f'production artists={len(prod_artists)}')
          print(f'manifest version={manifest["version"]}')
          print('kana audit: OK')
          print('new artist structure + Apple Music image audit: OK')
          print('manifest promoted hashes: OK')
          PY

      - name: Audit exact data diff
        shell: bash
        run: |
          set -euo pipefail
          expected=$(cat <<'EOF'
          data/artist/ateez.json
          data/artist/boynextdoor.json
          data/artist/bullet_train.json
          data/artist/candy_tune.json
          data/artist/illit.json
          data/artist/nakajima_kento.json
          data/artist/niziu.json
          data/artist/one_n_only.json
          data/artist/saucy_dog.json
          data/artist/xg.json
          data/artists.json
          data/manifest.json
          EOF
          )
          actual=$( { git diff --name-only -- data; git ls-files --others --exclude-standard -- data; } | sort -u )
          printf '%s\n' "$actual"
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"
          git diff --check -- data

      - name: Commit promoted data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/artists.json data/manifest.json \
            data/artist/bullet_train.json data/artist/illit.json \
            data/artist/one_n_only.json data/artist/candy_tune.json \
            data/artist/boynextdoor.json data/artist/saucy_dog.json \
            data/artist/ateez.json data/artist/niziu.json \
            data/artist/xg.json data/artist/nakajima_kento.json
          git rm .github/workflows/promote-new-artists-kana-20260828.yml
          git commit -m 'release: add 10 artists and kana search readings'
          git push origin HEAD:release/new-artists-kana-20260828
