name: One-shot HinataFes 2026 production promotion

on:
  push:
    paths:
      - '.github/workflows/temp-promote-hinatafes-cancelled.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote validated cancellation and run canonical checks
        shell: bash
        run: |
          set -euo pipefail
          echo '--- git status before ---'
          git status --short

          python3 - <<'PY'
          import copy
          import hashlib
          import json
          from pathlib import Path

          artist_path = Path('data/artist/hinatazaka46.json')
          data = json.loads(artist_path.read_text(encoding='utf-8'))
          before = copy.deepcopy(data)

          old_hash = hashlib.sha256(artist_path.read_bytes()).hexdigest()[:16]
          assert old_hash == 'eb06554520276879', old_hash

          target_ids = {
              'hinatazaka46_hinata_fes_2026_miyazaki_0905',
              'hinatazaka46_hinata_fes_2026_miyazaki_0906',
          }
          cancel_url = 'https://www.hinatazaka46.com/s/official/news/detail/E00906'
          verified_at = '2026-09-03T00:00:00+09:00'

          performances = {item['id']: item for item in data['performances']}
          assert target_ids <= performances.keys()

          for performance_id in sorted(target_ids):
              performance = performances[performance_id]
              assert performance['tourId'] == 'hinatazaka46_hinata_fes_2026'
              assert performance['venue'] == 'ひなたサンマリンスタジアム宮崎'
              assert performance['kind'] == 'fes'
              assert performance['eventName'] == 'ひなたフェス 2026'
              assert performance.get('eventStatus') in (None, 'cancelled')

              if 'eventStatus' not in performance:
                  reordered = {}
                  for key, value in performance.items():
                      if key == 'source':
                          reordered['eventStatus'] = 'cancelled'
                      reordered[key] = value
                  performance.clear()
                  performance.update(reordered)
              else:
                  performance['eventStatus'] = 'cancelled'

              performance['sourceUrl'] = cancel_url
              performance['lastVerifiedAt'] = verified_at

          assert data['tours'] == before['tours']
          assert data['lotteries'] == before['lotteries']
          assert data.get('appleMusicTracks') == before.get('appleMusicTracks')

          before_performances = {item['id']: item for item in before['performances']}
          after_performances = {item['id']: item for item in data['performances']}
          assert before_performances.keys() == after_performances.keys()
          for performance_id in before_performances:
              if performance_id not in target_ids:
                  assert before_performances[performance_id] == after_performances[performance_id]

          artist_path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          new_hash = hashlib.sha256(artist_path.read_bytes()).hexdigest()[:16]
          assert new_hash == '42f5a85b2792d3f7', new_hash
          print(f'hinatazaka46 hash: {old_hash} -> {new_hash}')

          for path in sorted(Path('data').rglob('*.json')):
              json.loads(path.read_text(encoding='utf-8'))
          PY

          echo '--- canonical collector validation ---'
          git clone --depth 1 https://github.com/TsubasA-lu-c/chatgpt-workspace.git /tmp/chatgpt-workspace
          COLLECTOR=/tmp/chatgpt-workspace/live-ticket-collector/source
          rm -rf "$COLLECTOR/data"
          cp -a "$GITHUB_WORKSPACE/data" "$COLLECTOR/data"

          cd "$COLLECTOR"
          python3 tools/materialize_artist_live_relations.py --check
          python3 tools/update_manifest.py
          python3 tools/validate.py

          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('data/manifest.json').read_text(encoding='utf-8'))
          assert manifest['version'] == 181, manifest['version']
          assert manifest['artists']['hinatazaka46']['hash'] == '42f5a85b2792d3f7'
          print(f"manifest version: {manifest['version']}")
          print(f"hinatazaka46 manifest hash: {manifest['artists']['hinatazaka46']['hash']}")
          PY

          cp "$COLLECTOR/data/manifest.json" "$GITHUB_WORKSPACE/data/manifest.json"
          cd "$GITHUB_WORKSPACE"

          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('data').rglob('*.json')):
              json.loads(path.read_text(encoding='utf-8'))
          manifest = json.loads(Path('data/manifest.json').read_text(encoding='utf-8'))
          assert manifest['version'] == 181
          assert manifest['artists']['hinatazaka46']['hash'] == '42f5a85b2792d3f7'
          PY

          git diff --check
          echo '--- production diff ---'
          git diff -- data/artist/hinatazaka46.json data/manifest.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/temp-promote-hinatafes-cancelled.yml
          git add -- data/artist/hinatazaka46.json data/manifest.json

          mapfile -t staged < <(git diff --cached --name-only)
          printf '%s\n' "${staged[@]}"
          if [ "${#staged[@]}" -ne 3 ]; then
            echo '[ERROR] unexpected staged file count'
            exit 1
          fi
          printf '%s\n' "${staged[@]}" | grep -Fx '.github/workflows/temp-promote-hinatafes-cancelled.yml'
          printf '%s\n' "${staged[@]}" | grep -Fx 'data/artist/hinatazaka46.json'
          printf '%s\n' "${staged[@]}" | grep -Fx 'data/manifest.json'

          git commit -m 'release: promote HinataFes 2026 cancellation'
          git push origin HEAD:release/hinatafes-cancelled-20260903

          echo '--- git status after ---'
          git status --short
