name: One-shot HinataFes 2026 production promotion

on:
  push:
    branches:
      - release/hinatafes-cancelled-20260903
    paths:
      - .github/workflows/temp-promote-hinatafes-cancelled.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact validated Dev data and refresh production manifest
        shell: bash
        run: |
          set -euo pipefail
          baseline='1d168a42193d9c29d0532d1197ea9bde2b1283a8'
          dev_sha='60b4d1b0f8c160e417fa434125412725896daae4'
          expected_hash='42f5a85b2792d3f7'
          workflow='.github/workflows/temp-promote-hinatafes-cancelled.yml'

          echo '--- branch state before promotion ---'
          git status --short
          git cat-file -e "${baseline}^{commit}"
          mapfile -t pre_changed < <(git diff --name-only "${baseline}..HEAD")
          printf '%s\n' "${pre_changed[@]}"
          test "${#pre_changed[@]}" -eq 1
          test "${pre_changed[0]}" = "$workflow"

          curl -fsSL \
            "https://raw.githubusercontent.com/TsubasA-lu-c/live-ticket-data-dev/${dev_sha}/data/artist/hinatazaka46.json" \
            -o /tmp/hinatazaka46.json

          EXPECTED_HASH="$expected_hash" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p = Path('/tmp/hinatazaka46.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          digest = hashlib.sha256(p.read_bytes()).hexdigest()[:16]
          expected = os.environ['EXPECTED_HASH']
          print('downloaded Hinatazaka46 hash:', digest)
          if digest != expected:
              raise SystemExit(f'[ERROR] Hinatazaka46 hash mismatch: {digest} != {expected}')

          target_ids = {
              'hinatazaka46_hinata_fes_2026_miyazaki_0905',
              'hinatazaka46_hinata_fes_2026_miyazaki_0906',
          }
          performances = {item['id']: item for item in data['performances']}
          assert target_ids <= performances.keys()
          for pid in target_ids:
              perf = performances[pid]
              assert perf['tourId'] == 'hinatazaka46_hinata_fes_2026'
              assert perf['eventStatus'] == 'cancelled'
              assert perf['sourceUrl'] == 'https://www.hinatazaka46.com/s/official/news/detail/E00906'
              assert perf['lastVerifiedAt'] == '2026-09-03T00:00:00+09:00'
          PY

          cp /tmp/hinatazaka46.json data/artist/hinatazaka46.json

          python3 - <<'PY'
          import hashlib, json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          data_dir = Path('data')
          manifest_path = data_dir / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest.get('version') != 180:
              raise SystemExit(f"[ERROR] expected production manifest 180, got {manifest.get('version')}")
          if manifest.get('artists', {}).get('hinatazaka46', {}).get('hash') != 'eb06554520276879':
              raise SystemExit('[ERROR] unexpected production Hinatazaka46 baseline hash')

          def h16(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()[:16]

          manifest['version'] = 181
          jst = timezone(timedelta(hours=9))
          manifest['updatedAt'] = datetime.now(jst).strftime('%Y-%m-%dT%H:%M:%S+09:00')
          manifest.setdefault('files', {}).setdefault('artists', {})['hash'] = h16(data_dir / 'artists.json')

          hashes = {p.stem: h16(p) for p in sorted((data_dir / 'artist').glob('*.json'))}
          artists = manifest.setdefault('artists', {})
          for artist_id, digest in hashes.items():
              artists.setdefault(artist_id, {})['hash'] = digest
          for artist_id in list(artists):
              if artist_id not in hashes:
                  del artists[artist_id]

          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('manifest version: 180 -> 181')
          print('manifest updatedAt:', manifest['updatedAt'])
          print('Hinatazaka46 hash:', artists['hinatazaka46']['hash'])
          PY

          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          for path in sorted(Path('data').rglob('*.json')):
              json.loads(path.read_text(encoding='utf-8'))

          p = Path('data/artist/hinatazaka46.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          target_ids = {
              'hinatazaka46_hinata_fes_2026_miyazaki_0905',
              'hinatazaka46_hinata_fes_2026_miyazaki_0906',
          }
          performances = {item['id']: item for item in data['performances']}
          for pid in target_ids:
              perf = performances[pid]
              assert perf['eventStatus'] == 'cancelled'
              assert perf['sourceUrl'] == 'https://www.hinatazaka46.com/s/official/news/detail/E00906'
              assert perf['lastVerifiedAt'] == '2026-09-03T00:00:00+09:00'
          digest = hashlib.sha256(p.read_bytes()).hexdigest()[:16]
          assert digest == '42f5a85b2792d3f7'

          manifest = json.loads(Path('data/manifest.json').read_text(encoding='utf-8'))
          assert manifest['version'] == 181
          assert manifest['artists']['hinatazaka46']['hash'] == digest
          print('promotion assertions: OK')
          PY

          git diff --check
          echo '--- data diff ---'
          git diff -- data/artist/hinatazaka46.json data/manifest.json

          mapfile -t data_changed < <(git diff --name-only -- data)
          printf '%s\n' "${data_changed[@]}"
          test "${#data_changed[@]}" -eq 2
          test "${data_changed[0]}" = 'data/artist/hinatazaka46.json'
          test "${data_changed[1]}" = 'data/manifest.json'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- "$workflow"
          git add -- data/artist/hinatazaka46.json data/manifest.json

          mapfile -t staged < <(git diff --cached --name-only)
          printf '%s\n' "${staged[@]}"
          test "${#staged[@]}" -eq 3
          printf '%s\n' "${staged[@]}" | grep -Fx "$workflow"
          printf '%s\n' "${staged[@]}" | grep -Fx 'data/artist/hinatazaka46.json'
          printf '%s\n' "${staged[@]}" | grep -Fx 'data/manifest.json'

          git commit -m 'release: stage HinataFes 2026 cancellation'
          git push origin HEAD:release/hinatafes-cancelled-20260903

          echo '--- final status ---'
          git status --short
