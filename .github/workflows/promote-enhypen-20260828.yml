name: Promote ENHYPEN 2026-08-28

on:
  push:
    branches:
      - release/enhypen-20260828

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/enhypen-20260828
      - name: Promote pinned ENHYPEN data
        run: python3 tools/promote_enhypen_20260828.py
      - name: Commit production data only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/artist/enhypen.json data/manifest.json
          git diff --cached --quiet && exit 1
          git commit -m "release: promote ENHYPEN 2026-08-28"
          git push origin HEAD:release/enhypen-20260828
