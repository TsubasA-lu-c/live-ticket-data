name: Sync audited dev data temp

on:
  push:
    branches:
      - release/sync-dev-remove-tennimu-20260829

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/sync-dev-remove-tennimu-20260829
          fetch-depth: 0

      - name: Copy latest audited dev data
        run: |
          git clone --depth 1 https://github.com/TsubasA-lu-c/live-ticket-data-dev.git /tmp/live-ticket-data-dev
          rm -rf data
          cp -a /tmp/live-ticket-data-dev/data ./data

          test ! -e data/artist/tennimu.json
          ! grep -q '"id": "tennimu"' data/artists.json
          ! grep -q '"tennimu"' data/manifest.json

          # Ensure every byte under data/ is identical to dev before commit.
          diff -qr /tmp/live-ticket-data-dev/data ./data

      - name: Commit production data only
        run: |
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git commit -m "release: sync audited dev data and remove tennimu"
          git push origin HEAD:release/sync-dev-remove-tennimu-20260829
