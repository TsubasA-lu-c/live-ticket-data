name: Promote weekly 2026-09-12 to production

on:
  push:
    branches:
      - release/weekly-20260912-production
    paths:
      - .github/workflows/promote-weekly-20260912-production.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/weekly-20260912-production
      - name: Probe runner
        run: |
          set -euo pipefail
          git status --short
          git rev-parse HEAD
