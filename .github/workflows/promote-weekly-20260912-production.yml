name: Promote weekly 2026-09-12 to production

on:
  push:
    branches:
      - release/weekly-20260912-production
    paths:
      - '.github/workflows/promote-weekly-20260912-production.yml'

permissions:
  contents: write

jobs:
  promote:
    if: github.event.head_commit.message != 'chore: remove production promotion workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/weekly-20260912-production
          fetch-depth: 2

      - name: Check starting tree
        run: |
          set -euo pipefail
          git status --short
          test "$(git rev-parse HEAD^)" = "58656ba3d322f7a00f827c6ca0e204d6115cd56c"

      - name: Verify production baselines and promote approved files
        shell: bash
        run: |
          set -euo pipefail
          BASE='b8366378b4f828cf27ae3b5f80d3c6945aff4710'
          SOURCE='f70006a60fc2116f597316bc1822e7d492cbe731'
          DEV="$RUNNER_TEMP/live-ticket-data-dev"
          git clone --quiet https://github.com/TsubasA-lu-c/live-ticket-data-dev.git "$DEV"
          git -C "$DEV" cat-file -e "$BASE^{commit}"
          git -C "$DEV" cat-file -e "$SOURCE^{commit}"

          targets=(
            data/artist/04_limited_sazabys.json
            data/artist/10_feet.json
            data/artist/ado.json
            data/artist/ae_group.json
            data/artist/aimyon.json
            data/artist/boku_aozora.json
            data/artist/bts.json
            data/artist/bump_of_chicken.json
            data/artist/candy_tune.json
            data/artist/creepy_nuts.json
            data/artist/enhypen.json
            data/artist/equal_love.json
            data/artist/frederic.json
            data/artist/fruits_zipper.json
            data/artist/hana.json
            data/artist/hinatazaka46.json
            data/artist/idolish7.json
            data/artist/illit.json
            data/artist/ive.json
            data/artist/jo1.json
            data/artist/kroi.json
            data/artist/kurayamisaka.json
            data/artist/larc_en_ciel.json
            data/artist/le_sserafim.json
            data/artist/masayoshi_oishi.json
            data/artist/miura_daichi.json
            data/artist/monaki.json
            data/artist/mr_children.json
            data/artist/niziu.json
            data/artist/nogizaka46.json
            data/artist/novelbright.json
            data/artist/oishi_masayoshi.json
            data/artist/ryokuoushoku_shakai.json
            data/artist/sakurazaka46.json
            data/artist/spitz.json
            data/artist/the_oral_cigarettes.json
            data/artist/vaundy.json
            data/artist/xg.json
            data/artist/yoasobi.json
          )
          test "${#targets[@]}" -eq 39

          mismatch=0
          for path in "${targets[@]}"; do
            baseline="$RUNNER_TEMP/baseline-$(basename "$path")"
            git -C "$DEV" show "$BASE:$path" > "$baseline"
            if ! cmp -s "$path" "$baseline"; then
              echo "BASELINE MISMATCH: $path"
              git diff --no-index -- "$baseline" "$path" || true
              mismatch=1
            fi
          done
          if [ "$mismatch" -ne 0 ]; then
            echo 'Production has independent changes in one or more promotion targets; stopping before write.'
            exit 2
          fi

          for path in "${targets[@]}"; do
            git -C "$DEV" show "$SOURCE:$path" > "$path"
            source_file="$RUNNER_TEMP/source-$(basename "$path")"
            git -C "$DEV" show "$SOURCE:$path" > "$source_file"
            cmp -s "$path" "$source_file"
          done

          python3 - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          data_dir = Path('data')
          artist_dir = data_dir / 'artist'
          manifest_path = data_dir / 'manifest.json'
          artists_path = data_dir / 'artists.json'

          def short_hash(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()[:16]

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          old_version = manifest.get('version', 0)
          manifest['version'] = old_version + 1
          manifest['updatedAt'] = datetime.now(
              timezone(timedelta(hours=9))
          ).strftime('%Y-%m-%dT%H:%M:%S+09:00')
          manifest.setdefault('files', {}).setdefault('artists', {})['hash'] = short_hash(artists_path)
          hashes = {}
          for path in sorted(artist_dir.glob('*.json')):
              hashes[path.stem] = short_hash(path)
              manifest.setdefault('artists', {}).setdefault(path.stem, {})['hash'] = hashes[path.stem]
          for aid in list(manifest.get('artists', {})):
              if aid not in hashes:
                  del manifest['artists'][aid]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'manifest version {old_version} -> {manifest["version"]}')
          PY

      - name: Validate production candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          data_dir = Path('data')
          artist_dir = data_dir / 'artist'
          artists = json.loads((data_dir / 'artists.json').read_text(encoding='utf-8'))
          manifest = json.loads((data_dir / 'manifest.json').read_text(encoding='utf-8'))
          docs = {}
          for path in sorted(artist_dir.glob('*.json')):
              docs[path.stem] = json.loads(path.read_text(encoding='utf-8'))

          artist_ids = {item['id'] for item in artists}
          assert artist_ids == set(docs), f'artist/file ID mismatch: {artist_ids ^ set(docs)}'

          for aid, doc in docs.items():
              assert doc.get('artistId') == aid, f'artistId mismatch: {aid}'
              tours = doc.get('tours')
              perfs = doc.get('performances')
              lots = doc.get('lotteries')
              assert isinstance(tours, list) and isinstance(perfs, list) and isinstance(lots, list), aid
              tour_ids = [x['id'] for x in tours]
              perf_ids = [x['id'] for x in perfs]
              lot_ids = [x['id'] for x in lots]
              assert len(tour_ids) == len(set(tour_ids)), f'duplicate tour ID: {aid}'
              assert len(perf_ids) == len(set(perf_ids)), f'duplicate performance ID: {aid}'
              assert len(lot_ids) == len(set(lot_ids)), f'duplicate lottery ID: {aid}'
              tour_set = set(tour_ids)
              perf_set = set(perf_ids)

              for tour in tours:
                  assert tour.get('artistId') == aid, f'tour artistId mismatch: {aid}/{tour.get("id")}'
                  relation = tour.get('relationDisplay')
                  if relation is not None:
                      assert isinstance(relation, dict)
                      assert relation.get('sourceArtistId')
                      assert relation.get('sourceTourId')
                      assert relation.get('officialTitle')
                      assert isinstance(relation.get('mirrored'), bool)
                      assert str(tour.get('title', '')).startswith('【'), f'relation title prefix missing: {aid}/{tour.get("id")}'

              for perf in perfs:
                  assert perf.get('tourId') in tour_set, f'unknown performance tour: {aid}/{perf.get("id")}'
                  assert perf.get('kind') in {'oneman', 'fes', 'taiban'}, f'bad kind: {aid}/{perf.get("id")}'
                  if perf.get('kind') in {'fes', 'taiban'}:
                      assert perf.get('eventName'), f'eventName missing: {aid}/{perf.get("id")}'
                  relation = perf.get('relationMirror')
                  if relation is not None:
                      assert isinstance(relation, dict)
                      assert relation.get('sourceArtistId') and relation.get('sourceId')

              for lot in lots:
                  assert lot.get('tourId') in tour_set, f'unknown lottery tour: {aid}/{lot.get("id")}'
                  pids = lot.get('performanceIds') or []
                  assert isinstance(pids, list), f'performanceIds type: {aid}/{lot.get("id")}'
                  for pid in pids:
                      assert pid in perf_set, f'unknown lottery performance: {aid}/{lot.get("id")}/{pid}'
                  relation = lot.get('relationMirror')
                  if relation is not None:
                      assert isinstance(relation, dict)
                      assert relation.get('sourceArtistId') and relation.get('sourceId')

          def short_hash(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()[:16]

          assert manifest['files']['artists']['hash'] == short_hash(data_dir / 'artists.json')
          for path in sorted(artist_dir.glob('*.json')):
              assert manifest['artists'][path.stem]['hash'] == short_hash(path), f'manifest hash mismatch: {path}'

          target = 'masayoshi_oishi_suga_shikao_acoustic_supernova_sendai_2027_0130'
          canonical = [p for p in docs['masayoshi_oishi']['performances'] if p.get('id') == target]
          assert len(canonical) == 1 and canonical[0].get('kind') == 'taiban'
          mirror_id = f'oishi_masayoshi__rel__{target}'
          mirror = [p for p in docs['oishi_masayoshi']['performances'] if p.get('id') == mirror_id]
          assert len(mirror) == 1 and mirror[0].get('kind') == 'taiban'
          assert mirror[0].get('relationMirror', {}).get('sourceId') == target

          print(f'validated {len(docs)} artist files and production manifest')
          PY

          git diff --check
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          printf '%s\n' "$changed" | grep -Ev '^(data/artist/(04_limited_sazabys|10_feet|ado|ae_group|aimyon|boku_aozora|bts|bump_of_chicken|candy_tune|creepy_nuts|enhypen|equal_love|frederic|fruits_zipper|hana|hinatazaka46|idolish7|illit|ive|jo1|kroi|kurayamisaka|larc_en_ciel|le_sserafim|masayoshi_oishi|miura_daichi|monaki|mr_children|niziu|nogizaka46|novelbright|oishi_masayoshi|ryokuoushoku_shakai|sakurazaka46|spitz|the_oral_cigarettes|vaundy|xg|yoasobi)\.json|data/manifest\.json)$' && { echo 'Unexpected changed files'; exit 1; } || true
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 40

      - name: Commit approved production data only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/artist/*.json data/manifest.json
          git diff --cached --name-only | sort
          test "$(git diff --cached --name-only | wc -l)" -eq 40
          git commit -m 'release: promote 2026-09-12 approved weekly updates'
          git push origin HEAD:release/weekly-20260912-production
          git status --short
