name: Temporary Oishi relation production promotion

on:
  push:
    branches:
      - promote/oishi-relations-venue-20260829

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: promote/oishi-relations-venue-20260829
          fetch-depth: 0

      - name: Promote approved Oishi relation data only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD origin/main)" = "d05badb014be505b75486c4e7f7f9dd827a30836"

          cp data/artists.json "$RUNNER_TEMP/prod-artists-before.json"
          dev="$RUNNER_TEMP/live-ticket-data-dev"
          git clone --quiet https://github.com/TsubasA-lu-c/live-ticket-data-dev.git "$dev"
          git -C "$dev" checkout --quiet 56ca2b9df112d8fd6cba2b976cc269042d2c0d5c
          test "$(git -C "$dev" rev-parse HEAD)" = "56ca2b9df112d8fd6cba2b976cc269042d2c0d5c"

          cp "$dev/data/artists.json" data/artists.json
          cp "$dev/data/artist/oishi_masayoshi.json" data/artist/oishi_masayoshi.json
          cp "$dev/data/artist/masayoshi_oishi.json" data/artist/masayoshi_oishi.json
          cp "$dev/data/artist_relations.json" data/artist_relations.json

          python3 - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          data = Path('data')
          old_artists = json.loads(Path(__import__('os').environ['RUNNER_TEMP']).joinpath('prod-artists-before.json').read_text(encoding='utf-8'))
          new_artists = json.loads((data / 'artists.json').read_text(encoding='utf-8'))
          old_by_id = {a['id']: a for a in old_artists}
          new_by_id = {a['id']: a for a in new_artists}
          added = set(new_by_id) - set(old_by_id)
          removed = set(old_by_id) - set(new_by_id)
          assert added == {'oishi_masayoshi', 'masayoshi_oishi'}, added
          assert not removed, removed
          for artist_id, old in old_by_id.items():
              assert new_by_id[artist_id] == old, artist_id

          relations = json.loads((data / 'artist_relations.json').read_text(encoding='utf-8'))
          assert {r['id'] for r in relations['relations']} == {
              'oishi_masayoshi__masayoshi_oishi', 'bz__koshi_inaba'
          }
          assert all(r.get('approvedByUser') is True for r in relations['relations'])

          oishi = json.loads((data / 'artist/oishi_masayoshi.json').read_text(encoding='utf-8'))
          masa = json.loads((data / 'artist/masayoshi_oishi.json').read_text(encoding='utf-8'))
          venue = '高槻市立桃園小学校グラウンド'
          source_id = 'oishi_masayoshi_takatsukidamashii_1011_20261011'
          mirror_id = 'masayoshi_oishi__rel__' + source_id
          source = next(p for p in oishi['performances'] if p['id'] == source_id)
          mirror = next(p for p in masa['performances'] if p['id'] == mirror_id)
          assert source['venue'] == venue
          assert mirror['venue'] == venue
          assert mirror['relationMirror'] == {
              'sourceArtistId': 'oishi_masayoshi',
              'sourceId': source_id,
          }

          def hash16(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()[:16]

          manifest_path = data / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          old_version = manifest['version']
          assert old_version == 176, old_version
          manifest['version'] = old_version + 1
          JST = timezone(timedelta(hours=9))
          manifest['updatedAt'] = datetime.now(JST).strftime('%Y-%m-%dT%H:%M:%S+09:00')
          manifest.setdefault('files', {}).setdefault('artists', {})['hash'] = hash16(data / 'artists.json')
          manifest.setdefault('artists', {})
          artist_hashes = {p.stem: hash16(p) for p in sorted((data / 'artist').glob('*.json'))}
          for aid, value in artist_hashes.items():
              manifest['artists'].setdefault(aid, {})['hash'] = value
          for aid in list(manifest['artists']):
              if aid not in artist_hashes:
                  del manifest['artists'][aid]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          assert manifest['files']['artists']['hash'] == 'a99c3b2ddccc79a3'
          assert manifest['artists']['oishi_masayoshi']['hash'] == '40423c814f594d56'
          assert manifest['artists']['masayoshi_oishi']['hash'] == 'dc11bb86feb373fa'
          print('Selective production promotion invariants: OK')
          PY

      - name: Ensure final production diff is limited
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-promote-oishi-relations-production.yml
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/tmp-promote-oishi-relations-production.yml' \
            'data/artist/masayoshi_oishi.json' \
            'data/artist/oishi_masayoshi.json' \
            'data/artist_relations.json' \
            'data/artists.json' \
            'data/manifest.json' | sort)"
          test "$changed" = "$expected" || { echo 'Unexpected diff:'; echo "$changed"; exit 1; }

      - name: Commit promotion data and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/artists.json data/artist/oishi_masayoshi.json data/artist/masayoshi_oishi.json data/artist_relations.json data/manifest.json .github/workflows/tmp-promote-oishi-relations-production.yml
          git commit -m "data: promote approved Oishi artist relations"
          git push origin HEAD:promote/oishi-relations-venue-20260829
